<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <circle cx="256" cy="256" r="256" fill="#48C78E"/>
  <!-- Cardboard Boxes sticking out -->
  <g transform="translate(135, 30)">
    <!-- Box 1 Left -->
    <rect x="25" y="45" width="105" height="95" rx="6" fill="#D97706" stroke="#B45309" stroke-width="4"/>
    <line x1="77" y1="45" x2="77" y2="140" stroke="#B45309" stroke-width="4" stroke-dasharray="6 4"/>
    <polygon points="25,45 45,20 110,20 130,45" fill="#F59E0B"/>
    <!-- Box 2 Right -->
    <rect x="115" y="25" width="100" height="115" rx="6" fill="#B45309" stroke="#78350F" stroke-width="4"/>
    <polygon points="115,25 140,5 190,5 215,25" fill="#D97706"/>
  </g>
  <!-- Bin Body -->
  <path d="M80 180 L120 490 C120 500, 130 505, 140 505 L372 505 C382 505, 392 500, 392 490 L432 180 Z" fill="#2563EB"/>
  <!-- Bin Rim -->
  <rect x="60" y="160" width="392" height="40" rx="10" fill="#1D4ED8"/>
  <!-- Bin Text -->
  <text x="256" y="265" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="46" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">CARDBOARD</text>
  <!-- Recycle Symbol -->
  <g transform="translate(256, 385) scale(0.95)">
    <path d="M-45 -55 L-20 -55 L-30 -35 L-15 -35 C5 -35 25 -20 35 0 L20 10 C12 -5 -2 -15 -15 -15 L-30 -15 L-20 5 Z" fill="#FFFFFF"/>
    <path d="M-45 -55 L-20 -55 L-30 -35 L-15 -35 C5 -35 25 -20 35 0 L20 10 C12 -5 -2 -15 -15 -15 L-30 -15 L-20 5 Z" fill="#FFFFFF" transform="rotate(120)"/>
    <path d="M-45 -55 L-20 -55 L-30 -35 L-15 -35 C5 -35 25 -20 35 0 L20 10 C12 -5 -2 -15 -15 -15 L-30 -15 L-20 5 Z" fill="#FFFFFF" transform="rotate(240)"/>
  </g>
</svg>